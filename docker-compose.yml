services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: screen
      POSTGRES_PASSWORD: screen
      POSTGRES_DB: screen
    ports:
      - "55432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screen"]
      interval: 3s
      timeout: 3s
      retries: 20
